<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes signalStream {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ripple {
        0% { r: 4px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }

      .floating-card-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .floating-card-3 { animation: floatSlow3 6s ease-in-out infinite; }
      .glow-orb-1 { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: 200px 80px; }
      .glow-orb-2 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 1000px 280px; }
      .pulse-ring-1 { animation: ripple 3s ease-out infinite; transform-origin: 1080px 70px; }
      .signal-path { stroke-dasharray: 10 14; animation: signalStream 4s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-glow)"/>

  <!-- Decorative Matrix / Background Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#soft-glow)" opacity="0.15" />
  <circle class="glow-orb-2" cx="1020" cy="270" r="160" fill="#a855f7" filter="url(#soft-glow)" opacity="0.12" />
  <circle cx="600" cy="180" r="220" fill="#6366f1" filter="url(#soft-glow)" opacity="0.08" />

  <!-- Animated Data Connection Streams (Underneath Content) -->
  <path class="signal-path" d="M 120 70 Q 300 130 500 70 T 900 110 T 1120 60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
  <path class="signal-path" d="M 80 290 Q 350 210 620 290 T 1100 280" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3" style="animation-direction: reverse;"/>

  <!-- Background Dynamic Floating Feature Badges (Edges & Background, safe from Title) -->
  <!-- Floating Badge Left: E2EE & Privacy -->
  <g class="floating-card-1" transform="translate(60, 45)">
    <rect width="180" height="48" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="28" cy="24" r="10" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="5" fill="#38bdf8"/>
    <text x="50" y="29" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">🔒 E2EE &amp; Zero-Trust</text>
  </g>

  <!-- Floating Badge Left Lower: Decentralized / Matrix / Nostr -->
  <g class="floating-card-2" transform="translate(45, 255)">
    <rect width="195" height="48" rx="24" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="28" cy="24" r="10" fill="#a855f7" fill-opacity="0.2"/>
    <polygon points="28,18 34,28 22,28" fill="#c084fc"/>
    <text x="50" y="29" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">⚡ Matrix &amp; Nostr Relay</text>
  </g>

  <!-- Floating Badge Right Upper: Real-Time Chat & Channels -->
  <g class="floating-card-3" transform="translate(945, 48)">
    <rect width="195" height="48" rx="24" fill="url(#card-grad)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="28" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="4" fill="#60a5fa"/>
    <text x="48" y="29" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">💬 Real-Time Channels</text>
  </g>

  <!-- Floating Badge Right Lower: AI Agent Collaboration -->
  <g class="floating-card-1" transform="translate(940, 252)">
    <rect width="205" height="48" rx="24" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="28" cy="24" r="10" fill="#10b981" fill-opacity="0.2"/>
    <rect x="23" y="19" width="10" height="10" rx="3" fill="#34d399"/>
    <text x="48" y="29" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">🤖 AI Agent Workspaces</text>
  </g>

  <!-- Foreground Divider Accent Line -->
  <line x1="320" y1="210" x2="880" y2="210" stroke="url(#glow-line)" stroke-width="2"/>

  <!-- ================= FOREGROUND HERO CONTENT (Guaranteed Unobscured) ================= -->
  <g text-anchor="middle">
    <!-- Top Super-header Tag -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
      <circle cx="-116" cy="0" r="4" fill="#38bdf8"/>
      <text x="8" y="5" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#primary-grad)" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome Team Messaging
    </text>
    <text x="600" y="192" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="-0.5">
      &amp; Collaboration Platforms
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="246" fill="#cbd5e1" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated directory of SaaS suites, self-hosted chat servers, federated networks &amp; AI-native workspaces
    </text>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(600, 292)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-250, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#93c5fd" font-size="11.5" font-weight="600">🏢 Commercial SaaS</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#86efac" font-size="11.5" font-weight="600">🔓 Self-Hosted OSS</text>
      </g>
      <!-- Pill 3: Matrix / Nostr -->
      <g transform="translate(85, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#d8b4fe" font-size="11.5" font-weight="600">🌐 Federated Comms</text>
      </g>
      <!-- Pill 4: AI Collab -->
      <g transform="translate(250, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#fde047" font-size="11.5" font-weight="600">🤖 AI-Native Agents</text>
      </g>
    </g>
  </g>
</svg>
